<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Air Strike - Edición Ataucusi</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="game-wrapper">
    <div class="hud">
      <div>Puntos: <span id="scoreText">0</span></div>
      <div>Arma: Lv <span id="weaponText">1</span></div>
      <div>Escudo: <span id="shieldText" class="shield-text">0</span></div>
      <div>Vida: <span id="hpText" class="hp-text">100</span></div>
    </div>

    <canvas id="gameCanvas" width="480" height="640"></canvas>

    <div class="controls-guide">
      Mover: <strong>Flechas / W A S D</strong> | Disparar: <strong>Espacio</strong>
    </div>

    <div id="gameOverScreen" class="game-over hidden">
      <h2>GAME OVER SUTTA</h2>
      <p>Puntuación Final: <span id="finalScore">0</span></p>
      <button id="btnRestart">Reintentar Misión</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
